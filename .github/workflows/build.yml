name: Build Schinza (Windows + macOS)

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: ["main"]        # push 到 main 自动重建（只出产物，不发 Release）
    tags: ["v*"]              # 打 v 标签自动重建 + 自动发 Release

jobs:
  build-mac:
    name: macOS (arm64)
    runs-on: macos-14          # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Schinza-mac.spec 依赖 mitmproxy CA，而私钥不进仓库：
      # 在 runner 上跑一次 mitmdump 让它在 ~/.mitmproxy 自动生成 CA
      - name: Generate mitmproxy CA on runner
        shell: bash
        run: |
          pip install -q -r requirements.txt
          mitmdump -q -p 8080 & PID=$!
          sleep 15
          kill "$PID" 2>/dev/null || true
          ls -1 "$HOME/.mitmproxy/" || true

      - name: Build .app / .dmg (build_mac.sh)
        shell: bash
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Package
        shell: bash
        run: |
          set -e
          # DMG 可选：hdiutil 在部分 CI 环境不产出，不能因此失败
          if [ -f dist/Schinza-mac-arm64.dmg ]; then
            mv dist/Schinza-mac-arm64.dmg Schinza-mac-arm64.dmg
          else
            echo "DMG 未生成（hdiutil 失败），跳过；.app zip 仍会产出"
          fi
          (cd dist && zip -r ../Schinza-mac-arm64.zip Schinza.app)

      - uses: actions/upload-artifact@v5
        with:
          name: Schinza-mac-arm64
          path: Schinza-mac-arm64.zip
          if-no-files-found: error

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate mitmproxy CA on runner
        shell: bash
        run: |
          pip install -q -r requirements.txt
          mitmdump -q -p 8080 & PID=$!
          sleep 15
          kill "$PID" 2>/dev/null || true
          for f in mitmproxy-ca.pem mitmproxy-ca-cert.p12 mitmproxy-ca.p12 mitmproxy-ca-cert.cer; do
            cp "$HOME/.mitmproxy/$f" ./ 2>/dev/null || true
          done
          ls -1 mitmproxy-ca* || true

      - name: Build with build.ps1
        shell: bash
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Package
        shell: bash
        run: powershell -Command "Compress-Archive -Path dist/Schinza -DestinationPath Schinza-windows-x64.zip -Force"

      - uses: actions/upload-artifact@v5
        with:
          name: Schinza-windows-x64
          path: Schinza-windows-x64.zip


  build-mac-intel:
    name: macOS (Intel x64)
    runs-on: macos-14          # arm64 runner + Rosetta 交叉编译 x86_64
    steps:
      - uses: actions/checkout@v5

      - name: Install universal2 Python (arm64 + x86_64)
        run: |
          curl -fL -o py.pkg "https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg"
          sudo installer -pkg py.pkg -target /

      - name: Bootstrap x86_64 venv + CA
        shell: bash
        run: |
          set -e
          PY="/Library/Frameworks/Python.framework/Versions/3.11/bin/python3"
          arch -x86_64 "$PY" -m venv .venv-x64
          # python.org 安装包自带 SSL 证书问题：先装 certifi 再以其为 CA
          arch -x86_64 .venv-x64/bin/python -m pip install --quiet             --trusted-host pypi.org --trusted-host files.pythonhosted.org certifi
          export SSL_CERT_FILE="$(arch -x86_64 .venv-x64/bin/python -c 'import certifi; print(certifi.where())')"
          arch -x86_64 .venv-x64/bin/python -m pip install --quiet -r requirements.txt
          # 生成 mitmproxy CA（私钥不进仓库）
          arch -x86_64 .venv-x64/bin/mitmdump -q -p 8080 & PID=$!
          sleep 15
          kill "$PID" 2>/dev/null || true
          for f in mitmproxy-ca.pem mitmproxy-ca-cert.p12 mitmproxy-ca.p12 mitmproxy-ca-cert.cer; do
            cp "$HOME/.mitmproxy/$f" ./ 2>/dev/null || true
          done
          ls -1 mitmproxy-ca* || true

      - name: Build Intel .app (Schinza-mac.spec)
        shell: bash
        run: |
          set -e
          export SSL_CERT_FILE="$(arch -x86_64 .venv-x64/bin/python -c 'import certifi; print(certifi.where())')"
          arch -x86_64 .venv-x64/bin/pyinstaller --noconfirm Schinza-mac.spec
          mv dist/Schinza.app dist/Schinza-x64.app

      - name: Package
        shell: bash
        run: |
          set -e
          (cd dist && zip -r ../Schinza-mac-x64.zip Schinza-x64.app)

      - uses: actions/upload-artifact@v5
        with:
          name: Schinza-mac-x64
          path: Schinza-mac-x64.zip

  release:
    name: Publish GitHub Release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-mac-intel, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Show artifacts
        run: find artifacts -type f | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
