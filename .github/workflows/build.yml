name: Build Schinza (Windows + macOS)

on:
  workflow_dispatch:          # 手动触发
  push:
    tags: ["v*"]              # 打 v 标签自动触发

jobs:
  build-mac:
    name: macOS ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon (arm64)
            artifact: mac-arm64
          - os: macos-13        # Intel (x86_64)
            artifact: mac-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Schinza-mac.spec 依赖 mitmproxy CA，而私钥不进仓库：
      # 在 runner 上跑一次 mitmdump 让它在 ~/.mitmproxy 自动生成 CA
      - name: Generate mitmproxy CA on runner
        shell: bash
        run: |
          pip install -q -r requirements.txt
          mitmdump -q -p 8080 & PID=$!
          sleep 15
          kill "$PID" 2>/dev/null || true
          ls -1 "$HOME/.mitmproxy/" || true

      - name: Build .app / .dmg (build_mac.sh)
        shell: bash
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Package
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_ARCH" = "ARM64" ]; then
            mv dist/Schinza-mac-arm64.dmg Schinza-mac-arm64.dmg
            (cd dist && zip -r ../Schinza-mac-arm64.zip Schinza.app)
          else
            mv dist/Schinza.app dist/Schinza-x64.app
            (cd dist && zip -r ../Schinza-mac-x64.zip Schinza-x64.app)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Schinza-${{ matrix.artifact }}
          path: |
            Schinza-mac-*.zip
            Schinza-mac-*.dmg

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate mitmproxy CA on runner
        shell: bash
        run: |
          pip install -q -r requirements.txt
          mitmdump -q -p 8080 & PID=$!
          sleep 15
          kill "$PID" 2>/dev/null || true
          for f in mitmproxy-ca.pem mitmproxy-ca-cert.p12 mitmproxy-ca.p12 mitmproxy-ca-cert.cer; do
            cp "$HOME/.mitmproxy/$f" ./ 2>/dev/null || true
          done
          ls -1 mitmproxy-ca* || true

      - name: Build with build.ps1
        shell: bash
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Package
        shell: bash
        run: powershell -Command "Compress-Archive -Path dist/Schinza -DestinationPath Schinza-windows-x64.zip -Force"

      - uses: actions/upload-artifact@v4
        with:
          name: Schinza-windows-x64
          path: Schinza-windows-x64.zip
