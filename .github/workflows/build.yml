name: Build Schinza (Windows + macOS)

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: ["main"]        # push 到 main 自动重建（只出产物，不发 Release）
    tags: ["v*"]              # 打 v 标签自动重建 + 自动发 Release

jobs:
  build-mac:
    name: macOS (arm64)
    runs-on: macos-14          # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Schinza-mac.spec 依赖 mitmproxy CA，而私钥不进仓库：
      # 在 runner 上跑一次 mitmdump 让它在 ~/.mitmproxy 自动生成 CA
      - name: Generate mitmproxy CA on runner
        shell: bash
        run: |
          pip install -q -r requirements.txt
          mitmdump -q -p 8080 & PID=$!
          sleep 15
          kill "$PID" 2>/dev/null || true
          ls -1 "$HOME/.mitmproxy/" || true

      - name: Build .app / .dmg (build_mac.sh)
        shell: bash
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Package
        shell: bash
        run: |
          set -e
          mv dist/Schinza-mac-arm64.dmg Schinza-mac-arm64.dmg
          (cd dist && zip -r ../Schinza-mac-arm64.zip Schinza.app)

      - uses: actions/upload-artifact@v5
        with:
          name: Schinza-mac-arm64
          path: |
            Schinza-mac-arm64.zip
            Schinza-mac-arm64.dmg

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate mitmproxy CA on runner
        shell: bash
        run: |
          pip install -q -r requirements.txt
          mitmdump -q -p 8080 & PID=$!
          sleep 15
          kill "$PID" 2>/dev/null || true
          for f in mitmproxy-ca.pem mitmproxy-ca-cert.p12 mitmproxy-ca.p12 mitmproxy-ca-cert.cer; do
            cp "$HOME/.mitmproxy/$f" ./ 2>/dev/null || true
          done
          ls -1 mitmproxy-ca* || true

      - name: Build with build.ps1
        shell: bash
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Package
        shell: bash
        run: powershell -Command "Compress-Archive -Path dist/Schinza -DestinationPath Schinza-windows-x64.zip -Force"

      - uses: actions/upload-artifact@v5
        with:
          name: Schinza-windows-x64
          path: Schinza-windows-x64.zip

  release:
    name: Publish GitHub Release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Show artifacts
        run: find artifacts -type f | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
